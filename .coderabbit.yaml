# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

# ---------------------------------------------------------------- #
# AI 기본 설정 (언어 및 리뷰 톤)
# ---------------------------------------------------------------- #

language: "ko-KR"

tone_instructions: >
    주니어의 성장을 돕는 시니어 백엔드 개발자처럼 리뷰해주세요.
    문제의 원인과 개선 방법을 명확히 설명하고, Spring Boot와 Java,
    클린코드 원칙을 기준으로 현실적인 개선안을 제안해주세요.
    말투는 친근하고 개선 중심으로 작성해주세요.


# ---------------------------------------------------------------- #
# 코드 리뷰 기능 세부 설정
# ---------------------------------------------------------------- #

reviews:

  # 적극적인 코드 리뷰
  profile: "assertive"

  # 최종 승인 여부는 직접 판단
  request_changes_workflow: false

  # PR 전체 변경사항 요약
  high_level_summary: true

  # Walkthrough에도 요약 표시
  high_level_summary_in_walkthrough: true

  high_level_summary_instructions: |
    PR의 변경 내용을 다음 순서로 간결하게 요약해주세요.

    1. API 또는 사용자 관점의 변경 사항
    2. 주요 비즈니스 로직 변경
    3. Entity / DB / Repository 변경
    4. 구조 또는 아키텍처 변경
    5. 예외 처리 / 보안 / 트랜잭션 관련 변경
    6. 잠재적인 위험 요소
    7. 리뷰어가 중점적으로 확인해야 할 부분

  # 흐름이 복잡한 경우 sequence diagram 생성
  sequence_diagrams: true

  in_progress_fortune: true
  poem: true

  auto_title_placeholder: "@rabbit-title"


  # ---------------------------------------------------------------- #
  # 자동 코드 리뷰 설정
  # ---------------------------------------------------------------- #

  auto_review:
    enabled: true
    drafts: false


  # ---------------------------------------------------------------- #
  # 경로별 Review Instructions
  # ---------------------------------------------------------------- #

  path_instructions:

    # -------------------------------------------------------------- #
    # Java 공통
    # -------------------------------------------------------------- #
    - path: "src/main/java/**/*.java"
      instructions: |
        Java + Spring Boot 코드를 전반적으로 리뷰해주세요.
        
        - 클래스와 메서드가 하나의 명확한 책임을 가지는지 확인합니다.
        - 메서드가 지나치게 길거나 중첩 depth가 깊지 않은지 확인합니다.
        - 변수명, 메서드명, 클래스명이 역할을 명확하게 표현하는지 확인합니다.
        - null 처리와 Optional 사용이 적절한지 확인합니다.
        - 불필요한 static 사용을 지양합니다.
        - 중복 로직이 있다면 공통화 가능성을 검토합니다.
        - 예외를 삼키거나 지나치게 광범위한 Exception을 잡고 있지 않은지 확인합니다.
        - checked / unchecked exception 사용이 적절한지 확인합니다.
        - 불필요한 객체 생성이나 비효율적인 컬렉션 사용이 없는지 확인합니다.
        - equals/hashCode 구현이 필요한 객체에서 적절하게 처리되어 있는지 확인합니다.
        - enum으로 표현할 수 있는 값이 문자열 상수로 관리되고 있지 않은지 확인합니다.
        - 매직 넘버와 하드코딩된 문자열 사용을 검토합니다.
        - Java 21 문법을 사용할 수 있는 경우 더 명확한 표현이 가능한지 검토합니다.
        - 클린코드와 객체지향 설계 원칙에 맞는지 확인합니다.
        - 과도한 추상화, 의미 없는 interface 분리, 불필요한 패턴 적용은 지양합니다.

    # -------------------------------------------------------------- #
    # Controller
    # -------------------------------------------------------------- #
    - path: "src/main/java/**/controller/**"
      instructions: |
        Spring MVC Controller 코드를 리뷰해주세요.
        
        - Controller가 HTTP 요청/응답 처리 역할에 집중하고 있는지 확인합니다.
        - Controller 내부에 비즈니스 로직이 포함되어 있다면 Service로 분리를 제안합니다.
        - Request DTO와 Response DTO를 적절하게 사용하고 있는지 확인합니다.
        - Entity를 그대로 Request/Response에 노출하고 있지 않은지 확인합니다.
        - @Valid, @Validated 등의 validation이 필요한 곳에 적용되어 있는지 확인합니다.
        - HTTP Method가 REST 의미에 맞게 사용되고 있는지 확인합니다.
        - HTTP Status Code가 상황에 맞게 반환되는지 확인합니다.
        - URI가 리소스 중심으로 설계되어 있는지 확인합니다.
        - PathVariable, RequestParam, RequestBody 사용이 적절한지 확인합니다.
        - API 응답 형식이 일관적인지 확인합니다.
        - 민감한 내부 정보나 Stack Trace가 응답으로 노출되지 않는지 확인합니다.
        - Controller에서 Repository를 직접 호출하고 있지 않은지 확인합니다.
        - Swagger / OpenAPI 문서와 실제 API 동작이 일치하는지 확인합니다.

    # -------------------------------------------------------------- #
    # Service
    # -------------------------------------------------------------- #
    - path: "src/main/java/**/service/**"
      instructions: |
        Service 계층의 비즈니스 로직을 리뷰해주세요.
        
        - Service가 실제 비즈니스 규칙과 흐름 제어 역할을 담당하는지 확인합니다.
        - 하나의 Service가 너무 많은 도메인을 책임지고 있지 않은지 확인합니다.
        - Controller나 Repository의 책임이 Service에 불필요하게 섞여 있지 않은지 확인합니다.
        - 트랜잭션이 필요한 메서드에 @Transactional이 적절히 적용되어 있는지 확인합니다.
        - read-only 조회 메서드에 @Transactional(readOnly = true)을 사용할 수 있는지 검토합니다.
        - 트랜잭션 범위가 지나치게 넓지 않은지 확인합니다.
        - 외부 API 호출이 DB 트랜잭션 안에서 불필요하게 오래 유지되지 않는지 확인합니다.
        - 동일한 비즈니스 로직이 여러 Service에 중복되어 있지 않은지 확인합니다.
        - 예외가 의미 있는 도메인 예외로 변환되는지 확인합니다.
        - 반환 타입이 지나치게 Entity 중심으로 구성되어 있지 않은지 확인합니다.
        - 다른 Service 간 순환 참조 가능성이 없는지 확인합니다.

    # -------------------------------------------------------------- #
    # Repository
    # -------------------------------------------------------------- #
    - path: "src/main/java/**/repository/**"
      instructions: |
        Repository 및 데이터 접근 코드를 리뷰해주세요.
        
        - Repository가 데이터 접근 책임에 집중하고 있는지 확인합니다.
        - 비즈니스 로직이 Repository에 들어가 있지 않은지 확인합니다.
        - 메서드 이름 기반 쿼리가 지나치게 복잡하지 않은지 확인합니다.
        - 필요한 경우 @Query 또는 QueryDSL 등으로 가독성을 개선할 수 있는지 검토합니다.
        - N+1 문제가 발생할 가능성이 있는지 확인합니다.
        - fetch join, EntityGraph 등의 사용이 필요한지 검토합니다.
        - 불필요하게 전체 데이터를 조회하고 있지 않은지 확인합니다.
        - Optional 반환이 적절하게 사용되고 있는지 확인합니다.
        - exists 쿼리로 해결할 수 있는 상황에서 전체 Entity를 조회하고 있지 않은지 확인합니다.
        - pagination이 필요한 조회에서 Pageable 사용 여부를 검토합니다.
        - DB index가 필요한 조회 조건이 있는지 확인합니다.

    # -------------------------------------------------------------- #
    # Entity
    # -------------------------------------------------------------- #
    - path: "src/main/java/**/entity/**"
      instructions: |
        JPA Entity 설계를 리뷰해주세요.
        
        - Entity가 도메인의 핵심 상태와 규칙을 적절하게 표현하는지 확인합니다.
        - Setter를 무분별하게 공개하고 있지 않은지 확인합니다.
        - 상태 변경은 의미 있는 메서드를 통해 수행하는 것을 권장합니다.
        - 생성자 또는 정적 팩토리 메서드를 통해 유효한 상태로 생성되는지 확인합니다.
        - nullable 여부가 도메인 규칙과 일치하는지 확인합니다.
        - @Column 제약조건과 실제 비즈니스 제약조건이 일치하는지 확인합니다.
        - 연관관계 방향이 적절한지 확인합니다.
        - 양방향 연관관계가 불필요하게 사용되고 있지 않은지 확인합니다.
        - cascade / orphanRemoval 설정이 안전한지 확인합니다.
        - FetchType.EAGER 사용을 지양하고 필요한 이유가 있는지 검토합니다.
        - enum이 문자열로 안전하게 저장되고 있는지 확인합니다.
        - @Enumerated(EnumType.STRING) 사용 여부를 확인합니다.
        - equals/hashCode 구현 시 JPA proxy 문제를 고려했는지 확인합니다.
        - toString에 연관관계가 포함되어 순환 참조가 발생하지 않는지 확인합니다.
        - 엔티티에 API DTO 책임이 섞여 있지 않은지 확인합니다.

    # -------------------------------------------------------------- #
    # DTO
    # -------------------------------------------------------------- #
    - path: "src/main/java/**/dto/**"
      instructions: |
        Request / Response DTO 설계를 리뷰해주세요.
        
        - Request DTO와 Response DTO 역할이 분리되어 있는지 확인합니다.
        - Entity를 그대로 외부에 노출하고 있지 않은지 확인합니다.
        - validation annotation이 적절하게 사용되고 있는지 확인합니다.
        - 필수값과 optional 값이 명확하게 구분되어 있는지 확인합니다.
        - primitive와 wrapper 타입 선택이 의도에 맞는지 확인합니다.
        - record를 사용할 수 있는 단순 불변 DTO인지 검토합니다.
        - DTO 변환 로직이 여기저기 중복되어 있지 않은지 확인합니다.
        - API 요구사항과 실제 타입이 일치하는지 확인합니다.
        - 민감한 정보가 Response DTO에 포함되지 않는지 확인합니다.

    # -------------------------------------------------------------- #
    # Exception
    # -------------------------------------------------------------- #
    - path: "src/main/java/**/exception/**"
      instructions: |
        예외 처리 구조를 리뷰해주세요.
        
        - 예외 클래스가 의미 있는 상황을 표현하는지 확인합니다.
        - RuntimeException 하나로 모든 상황을 처리하고 있지 않은지 확인합니다.
        - 비즈니스 예외와 시스템 예외가 적절히 구분되어 있는지 확인합니다.
        - GlobalExceptionHandler에서 예외별 HTTP Status가 적절한지 확인합니다.
        - 내부 구현 상세나 stack trace가 클라이언트에 노출되지 않는지 확인합니다.
        - 에러 응답 구조가 일관적인지 확인합니다.
        - 예외 메시지가 디버깅에 충분한 정보를 제공하는지 확인합니다.
        - 민감 정보가 예외 메시지나 로그에 포함되지 않는지 확인합니다.
        - 동일한 예외 처리가 중복되지 않는지 확인합니다.

    # -------------------------------------------------------------- #
    # Security
    # -------------------------------------------------------------- #
    - path: "src/main/java/**/security/**"
      instructions: |
        Spring Security 및 인증/인가 코드를 집중적으로 리뷰해주세요.
        
        - 인증과 인가 로직이 명확하게 분리되어 있는지 확인합니다.
        - Password, API Key, Token 등의 민감정보가 코드에 하드코딩되어 있지 않은지 확인합니다.
        - 비밀번호가 평문으로 저장되거나 비교되지 않는지 확인합니다.
        - JWT 사용 시 만료시간, 서명 검증, 재발급 로직이 안전한지 확인합니다.
        - Access Token과 Refresh Token의 책임이 적절히 분리되어 있는지 확인합니다.
        - Refresh Token Rotation을 사용하는 경우 재사용 공격 방지가 고려되어 있는지 확인합니다.
        - 인증이 필요한 API에 적절한 권한 검사가 적용되어 있는지 확인합니다.
        - permitAll 범위가 지나치게 넓지 않은지 확인합니다.
        - CORS 설정이 필요 이상으로 열려 있지 않은지 확인합니다.
        - CSRF 비활성화가 현재 인증 구조에서 타당한지 확인합니다.
        - 로그에 토큰이나 비밀번호가 출력되지 않는지 확인합니다.
        - 인증 실패와 권한 부족 응답이 구분되는지 확인합니다.

    # -------------------------------------------------------------- #
    # Config
    # -------------------------------------------------------------- #
    - path: "src/main/java/**/config/**"
      instructions: |
        Spring Configuration 코드를 리뷰해주세요.
        
        - 설정 클래스가 명확한 목적을 가지는지 확인합니다.
        - @Bean이 불필요하게 많이 선언되어 있지 않은지 확인합니다.
        - 환경별 설정값이 코드에 하드코딩되어 있지 않은지 확인합니다.
        - @ConfigurationProperties 사용이 적절한 경우 이를 고려합니다.
        - 외부 API Key, Secret, DB Password 등이 안전하게 주입되는지 확인합니다.
        - 개발/운영 환경 분리가 필요한 설정인지 검토합니다.
        - Bean 순환 참조 가능성이 없는지 확인합니다.
        - 설정 클래스에 비즈니스 로직이 포함되어 있지 않은지 확인합니다.

    # -------------------------------------------------------------- #
    # External API / Client
    # -------------------------------------------------------------- #
    - path: "src/main/java/**/client/**"
      instructions: |
        외부 API 연동 코드를 리뷰해주세요.
        
        - 외부 API 호출이 별도 Client 계층으로 적절히 분리되어 있는지 확인합니다.
        - timeout 설정이 있는지 확인합니다.
        - 네트워크 실패, 4xx, 5xx 응답을 적절히 처리하는지 확인합니다.
        - 외부 API의 응답 DTO와 내부 도메인 모델이 과도하게 결합되어 있지 않은지 확인합니다.
        - API Key, Token 등의 민감정보가 코드 또는 로그에 노출되지 않는지 확인합니다.
        - retry가 필요한 경우 무조건적인 재시도가 아닌지 확인합니다.
        - 동일 요청의 중복 실행에 따른 부작용이 있는지 검토합니다.
        - 외부 API 장애가 전체 서비스 장애로 전파될 가능성을 확인합니다.
        - HTTP Client 생성이 요청마다 반복되고 있지 않은지 확인합니다.

    # -------------------------------------------------------------- #
    # Parser
    # -------------------------------------------------------------- #
    - path: "src/main/java/**/parser/**"
      instructions: |
        Parser 및 문자열 변환 로직을 리뷰해주세요.
        
        - Parser가 파싱 책임에 집중하고 있는지 확인합니다.
        - 외부 API 호출이나 DB 접근 로직이 섞여 있지 않은지 확인합니다.
        - 정규식이 지나치게 복잡하거나 취약하지 않은지 확인합니다.
        - 입력 문자열이 null, blank 또는 예상 형식과 다른 경우를 처리하는지 확인합니다.
        - 숫자 파싱 시 NumberFormatException 가능성을 확인합니다.
        - 날짜 및 시간 파싱 시 timezone과 locale이 명확한지 확인합니다.
        - 잘못된 입력을 임의의 기본값으로 조용히 처리하지 않는지 확인합니다.
        - 파싱 실패 시 의미 있는 예외를 반환하는지 확인합니다.
        - 특정 포맷 하나에 지나치게 강하게 결합되어 있지 않은지 확인합니다.
        - 테스트 가능한 작은 단위로 분리되어 있는지 확인합니다.

    # -------------------------------------------------------------- #
    # Test
    # -------------------------------------------------------------- #
    - path: "src/test/java/**"
      instructions: |
        테스트 코드를 리뷰해주세요.
        
        - 테스트 이름이 테스트 의도를 명확하게 표현하는지 확인합니다.
        - Given / When / Then 구조가 읽기 쉽게 구성되어 있는지 확인합니다.
        - 하나의 테스트가 하나의 동작을 검증하는지 확인합니다.
        - 구현 세부사항이 아닌 외부 동작을 검증하고 있는지 확인합니다.
        - 테스트 간 상태 공유가 없는지 확인합니다.
        - 지나치게 많은 Mock을 사용해 테스트 의미가 약해지지 않았는지 확인합니다.
        - Service 테스트에서 Repository / Client 의존성을 적절히 Mock 처리했는지 확인합니다.
        - Parser, Utility 등 순수 로직은 단위 테스트가 충분한지 확인합니다.
        - 예외 상황과 edge case 테스트가 포함되어 있는지 확인합니다.
        - assertThrows, AssertJ 등을 적절하게 사용하고 있는지 확인합니다.
        - 테스트를 통과시키기 위한 의미 없는 assertion이 없는지 확인합니다.
        - 실제 외부 API 호출에 의존하는 테스트가 기본 테스트에 포함되어 있지 않은지 확인합니다.

    # -------------------------------------------------------------- #
    # application.yml / properties
    # -------------------------------------------------------------- #
    - path: "src/main/resources/application*.yml"
      instructions: |
        Spring 환경설정 파일을 리뷰해주세요.
        
        - Password, API Key, Token 등의 Secret이 직접 작성되어 있지 않은지 확인합니다.
        - 환경변수 참조가 적절하게 사용되고 있는지 확인합니다.
        - 개발/운영 환경별 설정을 분리해야 하는지 검토합니다.
        - logging level이 운영 환경에서 지나치게 상세하지 않은지 확인합니다.
        - ddl-auto 설정이 환경에 적절한지 확인합니다.
        - datasource 정보가 코드 저장소에 민감한 형태로 포함되지 않는지 확인합니다.
        - CORS, Swagger, Security 관련 설정이 운영 환경에서 안전한지 검토합니다.

    # -------------------------------------------------------------- #
    # SQL / Migration
    # -------------------------------------------------------------- #
    - path: "src/main/resources/db/**"
      instructions: |
        DB migration 및 SQL 코드를 리뷰해주세요.
        
        - 기존 데이터 손실 가능성이 있는지 확인합니다.
        - DROP / DELETE / ALTER 작업의 위험성을 확인합니다.
        - NOT NULL 컬럼 추가 시 기존 데이터에 대한 처리 방안이 있는지 확인합니다.
        - index 추가 또는 제거가 성능에 미치는 영향을 검토합니다.
        - migration이 재실행 가능한 구조인지 확인합니다.
        - 운영 DB에서 장시간 lock을 유발할 가능성이 있는지 검토합니다.
        - rollback 또는 장애 대응 가능성을 확인합니다.


  # ---------------------------------------------------------------- #
  # 정적 분석 / 보안 도구
  # ---------------------------------------------------------------- #

  tools:

    # Java 정적 분석
    checkstyle:
      enabled: true

    # Secret 탐지
    gitleaks:
      enabled: true